# The ClickStack collector: the one place the apps, the browser and the two
# Kubernetes collectors send OTLP, and the only one that writes to ClickHouse.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  labels: {{- include "clickshop.podLabels" (dict "name" "otel-gateway" "serviceName" "otel-gateway") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "clickshop.selectorLabels" "otel-gateway" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "clickshop.podLabels" (dict "name" "otel-gateway" "serviceName" "otel-gateway") | nindent 8 }}
    spec:
      containers:
        - name: otel-gateway
          image: {{ include "clickshop.image" (dict "name" "clickshop-otel-gateway" "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: metrics, containerPort: 8888 }
            - { name: health, containerPort: 13133 }
          envFrom: {{- include "clickshop.envFrom" . | nindent 12 }}
          # The entrypoint creates ClickStack's tables in retail_otel before the
          # collector starts, which takes a while the first time.
          startupProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 3
            failureThreshold: 100
          readinessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 20
            failureThreshold: 5
          resources: {{- toYaml .Values.otelGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  labels: {{- include "clickshop.selectorLabels" "otel-gateway" | nindent 4 }}
spec:
  selector: {{- include "clickshop.selectorLabels" "otel-gateway" | nindent 4 }}
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: metrics, port: 8888, targetPort: metrics }
