# The node collector: one pod on every node (a DaemonSet) that reads container
# logs, host metrics and the kubelet's pod and container metrics, and forwards
# them to the ClickStack gateway in the clickshop namespace.
#
# From the ClickStack guide "Monitoring Kubernetes with Managed ClickStack"
# (the DaemonSet file), with these changes for the workshop:
#   - the exporter points straight at the in-cluster gateway: no auth header
#     (the gateway has no token) and no ConfigMap to hold the address;
#   - the ClusterRole also grants nodes/stats;
#   - logs from pods that already export OTLP logs are dropped (see below);
#   - resource limits, because k3d shares one machine's memory.
mode: daemonset

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.123.0

# Required to use the kubeletstats cpu/memory utilization metrics
clusterRole:
  create: true
  rules:
    - apiGroups:
        - ''
      resources:
        - nodes/proxy
        - nodes/stats
      verbs:
        - get

presets:
  logsCollection:
    enabled: true
  hostMetrics:
    enabled: true
  # Adds the k8sattributes processor to every pipeline. Every pod label becomes a
  # resource attribute named exactly like the label, which is how `service.name`
  # and `deployment` on the workshop's pods reach the logs and metrics.
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
    extractAllPodAnnotations: true
  kubeletMetrics:
    enabled: true

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 384Mi }

config:
  receivers:
    kubeletstats:
      collection_interval: 20s
      auth_type: 'serviceAccount'
      endpoint: '${env:K8S_NODE_NAME}:10250'
      # k3d's kubelets use a certificate signed by the cluster's own CA.
      insecure_skip_verify: true
      metrics:
        k8s.pod.cpu_limit_utilization:
          enabled: true
        k8s.pod.cpu_request_utilization:
          enabled: true
        k8s.pod.memory_limit_utilization:
          enabled: true
        k8s.pod.memory_request_utilization:
          enabled: true
        k8s.pod.uptime:
          enabled: true
        k8s.node.uptime:
          enabled: true
        k8s.container.cpu_limit_utilization:
          enabled: true
        k8s.container.cpu_request_utilization:
          enabled: true
        k8s.container.memory_limit_utilization:
          enabled: true
        k8s.container.memory_request_utilization:
          enabled: true
        container.uptime:
          enabled: true

  processors:
    # The frontend and the demo services send their logs over OTLP with trace ids
    # attached, and also print them to stdout. Reading the stdout copy as well would
    # show every line twice in ClickStack, so pods labelled `otel.logs: otlp` (the
    # chart sets it on exactly those) are dropped here. The bridge, producers and
    # simulator only print to stdout, so their logs come through this collector.
    filter/otlp_logs:
      error_mode: ignore
      logs:
        log_record:
          - 'resource.attributes["otel.logs"] == "otlp"'

  exporters:
    otlphttp:
      endpoint: "http://otel-gateway.clickshop.svc:4318"
      compression: gzip

  service:
    pipelines:
      logs:
        # The chart's order, with the filter after k8sattributes: it needs the pod
        # labels that processor adds.
        processors:
          - k8sattributes
          - filter/otlp_logs
          - memory_limiter
          - batch
        exporters:
          - otlphttp
      metrics:
        exporters:
          - otlphttp
